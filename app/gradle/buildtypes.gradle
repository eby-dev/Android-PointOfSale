// AdMob IDs are injected per build variant via `resValue` so that debug
// builds always use Google's official test IDs (safe to click on) and
// release builds pick up the real IDs from `local.properties` or CI env
// vars. This keeps the real IDs out of the public repo and prevents the
// self-click invalid-traffic pattern that historically caused publisher
// account suspensions.
def admobProps = new Properties()
def admobPropsFile = rootProject.file('local.properties')
if (admobPropsFile.exists()) {
    admobPropsFile.withInputStream { admobProps.load(it) }
}
def readAdmobSecret = { String propKey, String envKey ->
    def value = admobProps.getProperty(propKey) ?: System.getenv(envKey)
    return (value == null || value.trim().isEmpty()) ? null : value.trim()
}

// Google's official AdMob test IDs — public, safe to hardcode.
// https://developers.google.com/admob/android/test-ads
def testAdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
def testAdMobBannerId = 'ca-app-pub-3940256099942544/6300978111'
def testAdMobInterstitialId = 'ca-app-pub-3940256099942544/1033173712'

// Release secrets are mandatory: a release build must never silently ship
// with Google's test IDs (no revenue, and it looks like broken inventory).
def requireAdmobSecret = { String key ->
    def value = readAdmobSecret(key, key)
    if (value == null) {
        throw new GradleException("[AdMob] Missing ${key}. Set it in local.properties or as an environment variable before building a release.")
    }
    return value
}

def releaseAdMobAppId = requireAdmobSecret('ADMOB_APPLICATION_ID')
def releaseAdMobBannerId = requireAdmobSecret('ADMOB_BANNER_AD_ID')
def releaseAdMobInterstitialId = requireAdmobSecret('ADMOB_INTERSTITIAL_AD_ID')

android {
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release_Release/out/lib'
                strippedNativeLibsDir 'build/intermediates/stripped_native_libs/release_Release/out/lib'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "SERVER_KEY", "\"prod\"")
            signingConfig signingConfigs.release

            resValue "string", "admob_application_id", releaseAdMobAppId
            resValue "string", "admob_banner_ads_id", releaseAdMobBannerId
            resValue "string", "admob_interstitial_ads_id", releaseAdMobInterstitialId
        }
        debug {
            debuggable true
            minifyEnabled false
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/debug_Debug/out/lib'
                strippedNativeLibsDir 'build/intermediates/stripped_native_libs/debug_Debug/out/lib'
            }
            buildConfigField("String", "SERVER_KEY", "\"dev\"")

            resValue "string", "admob_application_id", testAdMobAppId
            resValue "string", "admob_banner_ads_id", testAdMobBannerId
            resValue "string", "admob_interstitial_ads_id", testAdMobInterstitialId
        }
    }
}
