name: Android CI

on:
  push:
    branches:
      - development
      - master
      - internal-testing/**
      - play-internal/**
  workflow_dispatch:

env:
  KEYSTORE_FILE: PointOfSale.jks
  GOOGLE_PLAY_JSON: point-of-sale-pos-f219d5611b9d.json
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  FIREBASE_SERVICE_ACCOUNT_FILE: firebase-sa.json

jobs:
# =========================================================
# BUILD
# =========================================================
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Ruby & Dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 🔐 Decode secrets (runtime only)
      - name: Decode Keystore File
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > ${{ env.KEYSTORE_FILE }}

      - name: Create Google Service Account JSON
        run: echo "${{ secrets.GOOGLE_PLAY_JSON }}" | base64 -d > app/${{ env.GOOGLE_PLAY_JSON }}

      - name: Write secret.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > secret.properties
          echo "KEYSTORE_FILE=${{ github.workspace }}/${{ env.KEYSTORE_FILE }}" >> secret.properties
          echo "KEYSTORE_PASSWORD=${{ env.KEYSTORE_PASSWORD }}" >> secret.properties
          echo "KEY_ALIAS=${{ env.KEY_ALIAS }}" >> secret.properties
          echo "KEY_PASSWORD=${{ env.KEY_PASSWORD }}" >> secret.properties

      - name: Write AdMob IDs to local.properties
        run: |
          echo "ADMOB_APPLICATION_ID=${{ secrets.ADMOB_APPLICATION_ID }}" >> local.properties
          echo "ADMOB_BANNER_AD_ID=${{ secrets.ADMOB_BANNER_AD_ID }}" >> local.properties
          echo "ADMOB_INTERSTITIAL_AD_ID=${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}" >> local.properties

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build AAB via Fastlane
        run: bundle exec fastlane buildBundle

      # 📦 ONLY BUILD OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab

      # 🧹 Cleanup
      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ${{ env.KEYSTORE_FILE }}
          rm -f app/${{ env.GOOGLE_PLAY_JSON }}
          rm -f secret.properties
          rm -f local.properties

# =========================================================
# UNIT TEST
# =========================================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Write AdMob IDs to local.properties
        run: |
          echo "ADMOB_APPLICATION_ID=${{ secrets.ADMOB_APPLICATION_ID }}" >> local.properties
          echo "ADMOB_BANNER_AD_ID=${{ secrets.ADMOB_BANNER_AD_ID }}" >> local.properties
          echo "ADMOB_INTERSTITIAL_AD_ID=${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}" >> local.properties

      - run: chmod +x ./gradlew

      - run: bundle exec fastlane test

      - name: Cleanup secrets
        if: always()
        run: rm -f local.properties

# =========================================================
# LINT / CHECK
# =========================================================
  code-analysis:
    name: Lint & Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Write AdMob IDs to local.properties
        run: |
          echo "ADMOB_APPLICATION_ID=${{ secrets.ADMOB_APPLICATION_ID }}" >> local.properties
          echo "ADMOB_BANNER_AD_ID=${{ secrets.ADMOB_BANNER_AD_ID }}" >> local.properties
          echo "ADMOB_INTERSTITIAL_AD_ID=${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}" >> local.properties

      - run: chmod +x ./gradlew
      - run: ./gradlew clean check

      - uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/**/*.html
            app/build/intermediates/lint_intermediate_text_report/**/*.txt
            app/build/reports/lint-baseline.xml

      - name: Cleanup secrets
        if: always()
        run: rm -f local.properties

# =========================================================
# DEPLOY – PRODUCTION
# =========================================================
  deploy-release:
    name: Deploy to Play Store (Production)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - run: |
          bundle config set path 'vendor/bundle'
          bundle install

      - name: Create Google Service Account JSON
        run: echo "${{ secrets.GOOGLE_PLAY_JSON }}" | base64 -d > app/${{ env.GOOGLE_PLAY_JSON }}

      - name: Download built AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release

      - run: bundle exec fastlane deployRelease

# =========================================================
# DEPLOY – BETA
# =========================================================
  deploy-beta:
    name: Deploy to Play Store (Beta)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - run: |
          bundle config set path 'vendor/bundle'
          bundle install

      - name: Create Google Service Account JSON
        run: echo "${{ secrets.GOOGLE_PLAY_JSON }}" | base64 -d > app/${{ env.GOOGLE_PLAY_JSON }}

      - name: Download built AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release

      - run: bundle exec fastlane deployBeta

# =========================================================
# DEPLOY – PLAY STORE INTERNAL
# =========================================================
  deploy-internal:
    name: Deploy to Play Store (Internal Testing)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/play-internal/')
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - run: |
          bundle config set path 'vendor/bundle'
          bundle install

      - name: Create Google Service Account JSON
        run: echo "${{ secrets.GOOGLE_PLAY_JSON }}" | base64 -d > app/${{ env.GOOGLE_PLAY_JSON }}

      - name: Download built AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release

      - run: bundle exec fastlane deployInternal

# =========================================================
# DEPLOY – FIREBASE INTERNAL
# =========================================================
  deploy-firebase-internal:
    name: Distribute via Firebase (Internal)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/internal-testing/')
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - run: |
          bundle config set path 'vendor/bundle'
          bundle install

      - name: Download built AAB
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release

      - name: Decode Firebase service account
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 -d > ${{ env.FIREBASE_SERVICE_ACCOUNT_FILE }}

      - name: Point ADC at service account
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/${{ env.FIREBASE_SERVICE_ACCOUNT_FILE }}" >> $GITHUB_ENV

      - run: bundle exec fastlane deployFirebase --verbose

      - name: Cleanup service account
        if: always()
        run: rm -f ${{ env.FIREBASE_SERVICE_ACCOUNT_FILE }}